[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus-lab"
version = "0.1.0"
description = "Run a team of AI coding agents to reverse engineer and rebuild legacy software"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=8.2,<9"]
authors = [{ name = "Fabrice Roncoroni" }]
keywords = ["reverse-engineering", "ai-agents", "legacy-software", "porting", "claude-code", "codex", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/roncofaber/theseus-lab"
Documentation = "https://github.com/roncofaber/theseus-lab/tree/main/docs"
Issues = "https://github.com/roncofaber/theseus-lab/issues"
Changelog = "https://github.com/roncofaber/theseus-lab/blob/main/CHANGELOG.md"

[project.scripts]
theseus = "theseus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theseus = ["templates/**/*", "templates/**/.*", "scripts/*", "skills/**/*"]
